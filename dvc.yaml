stages:

# ===========================================================================
# DATA PIPELINE — needed by everyone
# Downloads Histo-Seg dataset + builds paired image/mask CSV.
# ===========================================================================

  fetch_histo_seg_manifest:
    cmd: python scripts/download_mendeley_histoseg.py --dataset-id vccj8mp2cg --expected-version 2 --manifest-out data/metadata/histo_seg_manifest.json
    deps:
      - scripts/download_mendeley_histoseg.py
      - params.yaml
    outs:
      - data/metadata/histo_seg_manifest.json
    params:
      - dataset.id
      - dataset.expected_version
      - dataset.manifest_json

  download_histo_seg_dataset:
    cmd: python scripts/download_mendeley_histoseg.py --manifest-in data/metadata/histo_seg_manifest.json --download --download-dir data/raw/histo_seg_v2 --skip-existing
    deps:
      - scripts/download_mendeley_histoseg.py
      - params.yaml
      - data/metadata/histo_seg_manifest.json
    outs:
      - data/raw/histo_seg_v2:
          persist: true
    params:
      - dataset.download_dir

  build_histoseg_pairs_csv:
    cmd: python scripts/build_histoseg_pairs_csv.py --dataset-dir data/raw/histo_seg_v2 --output-csv data/processed/histoseg_pairs.csv --stats-json data/processed/histoseg_pairs_stats.json
    deps:
      - scripts/build_histoseg_pairs_csv.py
      - params.yaml
      - data/raw/histo_seg_v2
    outs:
      - data/processed/histoseg_pairs.csv
      - data/processed/histoseg_pairs_stats.json
    params:
      - dataset.pairs_csv
      - dataset.pairs_stats_json

# ===========================================================================
# SIMULATION TILE DATASET — needed by friend (physics simulations)
# Builds oriented 512×512 tiles with RGB + semantic labels + epidermis masks.
# ===========================================================================

  build_tiles_for_simulation_dataset:
    cmd: python scripts/optical_ga/build_tiles_for_simulation.py --pairs-csv data/processed/histoseg_pairs.csv --output-dir data/artifacts/tiles_for_simulation --manifest-csv data/artifacts/tiles_for_simulation/tiles_manifest.csv --stats-json data/artifacts/tiles_for_simulation/tiles_stats.json --tile-size 512 --stride 256 --min-tissue-frac 0.25 --max-tissue-frac 0.98 --min-epidermis-frac 0.02 --min-air-epidermis-interface-px 64 --min-normal-confidence 0.55 --max-tiles-per-image 0 --max-total-tiles 0 --workers 0
    deps:
      - scripts/optical_ga/build_tiles_for_simulation.py
      - scripts/optical_ga/estimate_epidermis_normal.py
      - scripts/optical_ga/select_orient_tile_for_incidence.py
      - params.yaml
      - data/processed/histoseg_pairs.csv
    outs:
      - data/artifacts/tiles_for_simulation/rgb:
          cache: false
      - data/artifacts/tiles_for_simulation/label_id:
          cache: false
      - data/artifacts/tiles_for_simulation/label_vis:
          cache: false
      - data/artifacts/tiles_for_simulation/epidermis_mask:
          cache: false
      - data/artifacts/tiles_for_simulation/meta:
          cache: false
      - data/artifacts/tiles_for_simulation/tiles_manifest.csv:
          cache: false
      - data/artifacts/tiles_for_simulation/tiles_stats.json:
          cache: false
    params:
      - simulation_tiles.source_pairs_csv
      - simulation_tiles.output_dir
      - simulation_tiles.manifest_csv
      - simulation_tiles.stats_json
      - simulation_tiles.tile_size
      - simulation_tiles.stride
      - simulation_tiles.min_tissue_frac
      - simulation_tiles.max_tissue_frac
      - simulation_tiles.min_epidermis_frac
      - simulation_tiles.min_air_epidermis_interface_px
      - simulation_tiles.min_normal_confidence
      - simulation_tiles.max_tiles_per_image
      - simulation_tiles.max_total_tiles
      - simulation_tiles.workers

# ===========================================================================
# AKIO'S PC — SDXL LoRA config rendering + training (user's machine)
# ===========================================================================

  render_runtime_configs:
    cmd: python scripts/render_runtime_configs.py --params params.yaml --phase1-template configs/sdxl_lora_phase1_skin_histology.yaml --phase2-template configs/sdxl_lora_phase2_reward_skin_histology.yaml --phase3-template configs/sdxl_lora_phase3_morph_reward_skin_histology.yaml --phase1-out configs/runtime/sdxl_lora_phase1_skin_histology.runtime.yaml --phase2-out configs/runtime/sdxl_lora_phase2_reward_skin_histology.runtime.yaml --phase3-out configs/runtime/sdxl_lora_phase3_morph_reward_skin_histology.runtime.yaml --summary-out data/metadata/runtime_config_sync.json
    deps:
      - scripts/render_runtime_configs.py
      - params.yaml
      - configs/sdxl_lora_phase1_skin_histology.yaml
      - configs/sdxl_lora_phase2_reward_skin_histology.yaml
      - configs/sdxl_lora_phase3_morph_reward_skin_histology.yaml
    outs:
      - configs/runtime/sdxl_lora_phase1_skin_histology.runtime.yaml
      - configs/runtime/sdxl_lora_phase2_reward_skin_histology.runtime.yaml
      - configs/runtime/sdxl_lora_phase3_morph_reward_skin_histology.runtime.yaml
      - data/metadata/runtime_config_sync.json
    params:
      - models.sdxl_base_model
      - models.kohya_scripts_dir
      - dataset.pairs_csv
      - patch_workflow.training_mask_dir
      - pipeline.phase1_template
      - pipeline.phase2_template
      - pipeline.phase3_template
      - pipeline.phase1_runtime
      - pipeline.phase2_runtime
      - pipeline.phase3_runtime

  train_skin_lora_phase1:
    cmd: python scripts/synthetic_data/finetune_stable_diffusion_unified.py --config configs/runtime/sdxl_lora_phase1_skin_histology.runtime.yaml
    deps:
      - scripts/synthetic_data/finetune_stable_diffusion_unified.py
      - params.yaml
      - data/metadata/runtime_config_sync.json
      - configs/runtime/sdxl_lora_phase1_skin_histology.runtime.yaml
    outs:
      - outputs/finetunes/skin_histology_phase1:
          cache: false
    params:
      - pipeline.phase1_runtime

  train_skin_lora_phase2:
    cmd: python scripts/synthetic_data/phase2_reward_guided_lora.py --config configs/runtime/sdxl_lora_phase2_reward_skin_histology.runtime.yaml
    deps:
      - scripts/synthetic_data/phase2_reward_guided_lora.py
      - params.yaml
      - data/metadata/runtime_config_sync.json
      - configs/runtime/sdxl_lora_phase2_reward_skin_histology.runtime.yaml
      - outputs/finetunes/skin_histology_phase1
    outs:
      - outputs/finetunes/skin_histology_phase2_reward/run1:
          cache: false
    params:
      - pipeline.phase2_runtime

  train_skin_lora_phase3:
    cmd: python scripts/synthetic_data/phase3_morph_reward_guided_lora.py --config configs/runtime/sdxl_lora_phase3_morph_reward_skin_histology.runtime.yaml
    deps:
      - scripts/synthetic_data/phase3_morph_reward_guided_lora.py
      - params.yaml
      - data/metadata/runtime_config_sync.json
      - configs/runtime/sdxl_lora_phase3_morph_reward_skin_histology.runtime.yaml
      - outputs/finetunes/skin_histology_phase2_reward/run1
    outs:
      - outputs/finetunes/skin_histology_phase3_morph_reward/run1:
          cache: false
    params:
      - pipeline.phase3_runtime

# ===========================================================================
# AKIO'S PC — Tile mining + materialization (for SDXL tile-based training)
# Builds index of 512×512 tiles from full-res slides, then materializes them
# and generates random masks for masked SDXL inpainting training.
# ===========================================================================

  build_histoseg_tile_index:
    cmd: python scripts/patches/build_tile_index_from_masks.py --pairs-csv data/processed/histoseg_pairs.csv --output-csv data/processed/histoseg_tile_pairs.csv --stats-json data/processed/histoseg_tile_pairs_stats.json --tile-size 512 --stride 64 --min-mask-frac 0.15 --max-mask-frac 0.95 --max-white-frac 0.30 --white-threshold 235 --max-tiles-per-image 250 --max-total-tiles 0 --selection-mode random --seed 222 --workers 20
    deps:
      - scripts/patches/build_tile_index_from_masks.py
      - params.yaml
      - data/processed/histoseg_pairs.csv
    outs:
      - data/processed/histoseg_tile_pairs.csv
      - data/processed/histoseg_tile_pairs_stats.json
    params:
      - tile_mining.source_pairs_csv
      - tile_mining.output_csv
      - tile_mining.stats_json
      - tile_mining.tile_size
      - tile_mining.stride
      - tile_mining.min_mask_frac
      - tile_mining.max_mask_frac
      - tile_mining.max_white_frac
      - tile_mining.white_threshold
      - tile_mining.max_tiles_per_image
      - tile_mining.max_total_tiles
      - tile_mining.selection_mode
      - tile_mining.seed
      - tile_mining.workers

  materialize_histoseg_tile_dataset:
    cmd: python scripts/patches/materialize_tile_dataset.py --labels-csv data/processed/histoseg_tile_pairs.csv --output-dir data/artifacts/tiles/materialized_512 --workers 20 --clean --stats-json data/artifacts/tiles/materialized_512_stats.json
    deps:
      - scripts/patches/materialize_tile_dataset.py
      - params.yaml
      - data/processed/histoseg_tile_pairs.csv
    outs:
      - data/artifacts/tiles/materialized_512:
          cache: false
      - data/artifacts/tiles/materialized_512_stats.json
    params:
      - tile_dataset.labels_csv
      - tile_dataset.output_dir
      - tile_dataset.stats_json
      - tile_dataset.workers

  generate_histoseg_tile_random_masks:
    cmd: python scripts/patches/generate_random_tile_masks.py --image-dir data/artifacts/tiles/materialized_512 --output-dir data/artifacts/tiles/masks_random_512 --workers 20 --seed 222 --white-threshold 235 --tissue-min-overlap 0.75 --max-attempts 20 --min-area-frac 0.08 --max-area-frac 0.22 --min-strokes 1 --max-strokes 4 --min-vertices 3 --max-vertices 8 --min-brush-px 24 --max-brush-px 128 --feather-radius 2.0 --mask-strength 1.0 --overwrite --stats-json data/artifacts/tiles/masks_random_512_stats.json
    deps:
      - scripts/patches/generate_random_tile_masks.py
      - params.yaml
      - data/artifacts/tiles/materialized_512
    outs:
      - data/artifacts/tiles/masks_random_512:
          cache: false
      - data/artifacts/tiles/masks_random_512_stats.json
    params:
      - tile_masks.image_dir
      - tile_masks.output_dir
      - tile_masks.stats_json
      - tile_masks.workers
      - tile_masks.seed
      - tile_masks.white_threshold
      - tile_masks.tissue_min_overlap
      - tile_masks.max_attempts
      - tile_masks.min_area_frac
      - tile_masks.max_area_frac
      - tile_masks.min_strokes
      - tile_masks.max_strokes
      - tile_masks.min_vertices
      - tile_masks.max_vertices
      - tile_masks.min_brush_px
      - tile_masks.max_brush_px
      - tile_masks.feather_radius
      - tile_masks.mask_strength

# ===========================================================================
# AKIO'S PC — Patch workflow (ROI extraction for 2D SDXL inpainting)
# Extracts patches around ROI masks, inpaints with SDXL LoRA, merges back. 
# ===========================================================================

  extract_roi_patches:
    cmd: python scripts/patches/extract_roi_patches.py --csv data/processed/histoseg_pairs.csv --image-dir data/raw/histo_seg_v2 --mask-dir data/artifacts/roi_masks/histoseg_pairs --output-dir data/artifacts/patches --patch-size 1024 --target-size 512 --max-slices 0
    deps:
      - scripts/patches/extract_roi_patches.py
      - data/processed/histoseg_pairs.csv
      - data/raw/histo_seg_v2
    outs:
      - data/artifacts/patches/patches:
          cache: false
      - data/artifacts/patches/masks:
          cache: false
      - data/artifacts/patches/metadata/patches_metadata.csv

  inpaint_roi_patches:
    cmd: python scripts/patches/inpaint_roi_patches.py --metadata-csv data/artifacts/patches/metadata/patches_metadata.csv --output-dir data/artifacts/inpainted --base-model /home/fertroll10/Documents/ML/SUS_scraper/pretrained_models/sd_xl_base_1.0.safetensors --lora-weights outputs/finetunes/skin_histology_phase1/last.safetensors --dry-run
    deps:
      - scripts/patches/inpaint_roi_patches.py
      - data/artifacts/patches/metadata/patches_metadata.csv
      - data/artifacts/patches/patches
      - data/artifacts/patches/masks
    outs:
      - data/artifacts/inpainted/images:
          cache: false
      - data/artifacts/inpainted/metadata/inpaint_metadata.csv

  merge_inpainted_patches:
    cmd: python scripts/patches/merge_inpainted_patches.py --inpaint-metadata data/artifacts/inpainted/metadata/inpaint_metadata.csv --extract-metadata data/artifacts/patches/metadata/patches_metadata.csv --output-dir data/artifacts/merged
    deps:
      - scripts/patches/merge_inpainted_patches.py
      - data/artifacts/inpainted/metadata/inpaint_metadata.csv
      - data/artifacts/patches/metadata/patches_metadata.csv
      - data/artifacts/inpainted/images
    outs:
      - data/artifacts/merged/slices:
          cache: false
      - data/artifacts/merged/metadata/merge_metadata.csv

  qc_patch_replacement:
    cmd: python scripts/patches/qc_patch_replacement.py --merge-metadata data/artifacts/merged/metadata/merge_metadata.csv --output-dir data/artifacts/qc
    deps:
      - scripts/patches/qc_patch_replacement.py
      - data/artifacts/merged/metadata/merge_metadata.csv
      - data/artifacts/merged/slices
    outs:
      - data/artifacts/qc/metadata/qc_metadata.csv
      - data/artifacts/qc/reports/qc_summary.json

# ===========================================================================
# 3D COHERENCE — self-contained smoke tests (optional, no data download)
# Generates synthetic masks/volumes, stacks to NIfTI, runs tile-first pipeline.
# ===========================================================================

  generate_3d_test_masks:
    cmd: python scripts/3d/propagate_mask_across_slices.py --num-slices 10 --height 256 --width 256 --radius 0.3 --output-dir data/artifacts/3d/test_masks --stats-json data/artifacts/3d/test_masks_stats.json
    deps:
      - scripts/3d/propagate_mask_across_slices.py
    outs:
      - data/artifacts/3d/test_masks:
          cache: false
      - data/artifacts/3d/test_masks_stats.json

  stack_3d_test_volume:
    cmd: python scripts/3d/stack_slices_to_nifti.py --input-glob "data/artifacts/3d/test_masks/mask_slice_*.png" --output-nifti data/artifacts/3d/test_volume.nii.gz --pixdim 1.0 1.0 2.0 --stats-json data/artifacts/3d/test_volume_stats.json
    deps:
      - scripts/3d/stack_slices_to_nifti.py
      - data/artifacts/3d/test_masks
    outs:
      - data/artifacts/3d/test_volume.nii.gz
      - data/artifacts/3d/test_volume_stats.json

  compute_3d_test_coherence:
    cmd: python scripts/3d/compute_z_coherence_metrics.py --volume-nifti data/artifacts/3d/test_volume.nii.gz --output-json data/artifacts/3d/test_coherence.json
    deps:
      - scripts/3d/compute_z_coherence_metrics.py
      - data/artifacts/3d/test_volume.nii.gz
    outs:
      - data/artifacts/3d/test_coherence.json

  generate_3d_synthetic_slices:
    cmd: python scripts/3d/generate_synthetic_slices.py --num-slices 10 --height 256 --width 256 --pattern gradient --output-dir data/artifacts/3d/synthetic_slices --stats-json data/artifacts/3d/synthetic_slices_stats.json
    deps:
      - scripts/3d/generate_synthetic_slices.py
    outs:
      - data/artifacts/3d/synthetic_slices:
          cache: false
      - data/artifacts/3d/synthetic_slices_stats.json

  run_3d_volume_inpaint_smoke:
    cmd: python scripts/3d/run_volume_inpaint_pipeline.py --slice-glob "data/artifacts/3d/synthetic_slices/slice_*.png" --volume-id test_vol --coarse-label non_cancer --num-slices 10 --slice-height 256 --slice-width 256 --mask-radius 0.3 --output-dir data/artifacts/3d/volume_inpaint_runs --dry-run
    deps:
      - scripts/3d/run_volume_inpaint_pipeline.py
      - scripts/3d/build_volume_inpaint_metadata.py
      - scripts/3d/propagate_mask_across_slices.py
      - scripts/3d/stack_slices_to_nifti.py
      - scripts/3d/compute_z_coherence_metrics.py
      - scripts/patches/inpaint_roi_patches.py
      - data/artifacts/3d/synthetic_slices
    outs:
      - data/artifacts/3d/volume_inpaint_runs:
          cache: false

  run_3d_volume_inpaint_tile_smoke:
    cmd: python scripts/3d/run_volume_inpaint_pipeline.py --slice-glob "data/artifacts/3d/synthetic_slices/slice_*.png" --volume-id tile_smoke --coarse-label non_cancer --num-slices 10 --mask-radius 0.3 --strict-bbox --patch-size 512 --output-dir data/artifacts/3d/tile_inpaint_runs --dry-run
    deps:
      - scripts/3d/run_volume_inpaint_pipeline.py
      - scripts/3d/propagate_mask_across_slices.py
      - scripts/3d/stack_slices_to_nifti.py
      - scripts/3d/compute_z_coherence_metrics.py
      - scripts/patches/extract_roi_patches.py
      - scripts/patches/inpaint_roi_patches.py
      - scripts/patches/merge_inpainted_patches.py
      - data/artifacts/3d/synthetic_slices
    outs:
      - data/artifacts/3d/tile_inpaint_runs:
          cache: false

# ===========================================================================
# OPTICAL GA — skin biophysical parameter estimation
# Surrogate-mode smoke tests (fast, no MCX binary needed).
# ===========================================================================

  run_optical_ga_smoke:
    cmd: python scripts/optical_ga/ga_optimiser_optical.py --generations 3 --population-size 8 --target-L 60 --target-a 10 --target-b 15 --forward-mode surrogate --fitness-mode lab --output-dir outputs/optical_ga/smoke_test --seed 42
    deps:
      - scripts/optical_ga/ga_optimiser_optical.py
      - scripts/optical_ga/genome_encoding_optical.py
      - scripts/optical_ga/forward_model.py
      - scripts/optical_ga/colorimetry.py
      - scripts/optical_ga/optical_fitness.py
      - params.yaml
    outs:
      - outputs/optical_ga/smoke_test/best_genome.json:
          cache: false
      - outputs/optical_ga/smoke_test/ga_history.csv:
          cache: false
    params:
      - optical_ga.forward_mode
      - optical_ga.fitness_mode
      - optical_ga.generations
      - optical_ga.population_size

# ===========================================================================
# ORIENTED TILE EXTRACTION — epidermis-air interface alignment
# ===========================================================================

  extract_orient_tile_smoke:
    cmd: >
      mkdir -p data/artifacts/orient_smoke/tile &&
      python -c "import numpy as np; from PIL import Image as PILImage;
      img = np.zeros((256,256,3),dtype=np.uint8); img[:,:,:]=100; img[:,128:,0]=200;
      mask = np.zeros((256,256),dtype=np.uint8); mask[:,128:]=1;
      PILImage.fromarray(img).save('data/artifacts/orient_smoke/src.png');
      PILImage.fromarray((mask*255).astype(np.uint8)).save('data/artifacts/orient_smoke/mask.png');
      print('Synthetic data generated')" &&
      python scripts/optical_ga/estimate_epidermis_normal.py
      --mask data/artifacts/orient_smoke/mask.png
      --output data/artifacts/orient_smoke/normal.json &&
      python scripts/optical_ga/select_orient_tile_for_incidence.py
      --image data/artifacts/orient_smoke/src.png
      --mask data/artifacts/orient_smoke/mask.png
      --normal-json data/artifacts/orient_smoke/normal.json
      --tile-size 64
      --output-dir data/artifacts/orient_smoke/tile

    deps:
      - scripts/optical_ga/estimate_epidermis_normal.py
      - scripts/optical_ga/select_orient_tile_for_incidence.py
      - params.yaml
    outs:
      - data/artifacts/orient_smoke/normal.json:
          cache: false
      - data/artifacts/orient_smoke/tile/orient_tile.png:
          cache: false
      - data/artifacts/orient_smoke/tile/orient_tile_metadata.json:
          cache: false

# ===========================================================================
# OPTICAL GA BATCH COMPARE — multi-seed comparison (MCX vs surrogate)
# ===========================================================================

  run_optical_ga_batch_compare_smoke:
    cmd: >
      python scripts/optical_ga/run_optical_ga_batch_compare.py
      --config configs/optical_ga_shared_bounds.json
      --num-seeds 2
      --generations 3
      --population-size 8
      --forward-mode surrogate
      --seed-offset 0
      --output-dir outputs/optical_ga/batch_compare_smoke

    deps:
      - scripts/optical_ga/run_optical_ga_batch_compare.py
      - scripts/optical_ga/ga_optimiser_optical.py
      - scripts/optical_ga/genome_encoding_optical.py
      - scripts/optical_ga/forward_model.py
      - scripts/optical_ga/colorimetry.py
      - scripts/optical_ga/optical_fitness.py
      - scripts/optical_ga/mc_wrapper.py
      - configs/optical_ga_shared_bounds.json
      - params.yaml
    outs:
      - outputs/optical_ga/batch_compare_smoke/per_seed_metrics.json:
          cache: false
      - outputs/optical_ga/batch_compare_smoke/aggregate_stats.json:
          cache: false
      - outputs/optical_ga/batch_compare_smoke/leaderboard.csv:
          cache: false
    params:
      - batch_compare.num_seeds
      - batch_compare.generations
      - batch_compare.population_size
      - batch_compare.forward_mode
      - batch_compare.fitness_mode

# ===========================================================================
# BEST-RUN VIDEO RENDERING — generate GA evolution video
# ===========================================================================

  render_optical_ga_video_smoke:
    cmd: >
      python scripts/optical_ga/render_best_run_video.py
      --smoke-test
      --smoke-generations 6
      --smoke-output data/artifacts/ga_video_smoke
      --fps 2
      --keep-frames
      --frame-width 800
      --frame-height 600

    deps:
      - scripts/optical_ga/render_best_run_video.py
      - params.yaml
    outs:
      - data/artifacts/ga_video_smoke/video/frames:
          cache: false
      - data/artifacts/ga_video_smoke/video/best_run_video.mp4:
          cache: false
    params:
      - video_render.fps
      - video_render.frame_width
      - video_render.frame_height
      - video_render.keep_frames

# ===========================================================================
# MULTI-PHYSICS MVP — end-to-end simulation pipeline smoke test
# Generates label volume → MCX fluence → GA → thermal → colorimetry
# ===========================================================================

  generate_mvp_smoke_label_volume:
    cmd: python scripts/simulation/generate_mvp_smoke_volume.py --output data/artifacts/mvp/smoke_label_volume.npy --shape 8 8 8
    deps:
      - scripts/simulation/generate_mvp_smoke_volume.py
      - params.yaml
    outs:
      - data/artifacts/mvp/smoke_label_volume.npy:
          cache: false

  run_mvp_multiphysics_smoke:
    cmd: python scripts/simulation/run_mvp_multiphysics_from_config.py --config configs/mvp_multiphysics_example.yaml --label-volume data/artifacts/mvp/smoke_label_volume.npy --output-dir data/artifacts/mvp/smoke_run
    deps:
      - scripts/simulation/run_mvp_multiphysics_from_config.py
      - scripts/simulation/run_mvp_multiphysics_pipeline.py
      - scripts/simulation/mcx_build_volume.py
      - scripts/simulation/mcx_batch_runner.py
      - scripts/simulation/mcx_extract_fluence.py
      - scripts/simulation/thermal_build_model.py
      - scripts/simulation/thermal_solve.py
      - scripts/simulation/thermal_visualise.py
      - scripts/simulation/colorimetry_metrics.py
      - scripts/optical_ga/ga_optimiser_optical.py
      - scripts/optical_ga/genome_encoding_optical.py
      - scripts/optical_ga/forward_model.py
      - scripts/optical_ga/optical_fitness.py
      - configs/mvp_multiphysics_example.yaml
      - data/artifacts/mvp/smoke_label_volume.npy
    outs:
      - data/artifacts/mvp/smoke_run:
          cache: false
